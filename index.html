  input.value = saved && saved.input ? saved.input : '';
  input.disabled = current.answered;
  if (!current.answered) input.focus();
  document.getElementById('feedback').innerHTML = saved && saved.feedback ? saved.feedback : '';
  document.getElementById('solution').innerHTML = saved && saved.solution ? saved.solution : '';
  if (saved && saved.solution) {
    bindSolutionToggle();
    var solBody = document.getElementById('solBody');
    if (solBody && saved.solutionOpen) solBody.classList.remove('hidden');
  }
  document.getElementById('submitBtn').classList.toggle('hidden', current.answered);
  document.getElementById('nextBtn').classList.toggle('hidden', !current.answered);

function normalize(s) {
  s = String(s).toLowerCase().trim();
  s = s.replace(/[\s，,。．.、；;：:！!？?（）()\[\]【】“”"'＋+]/g, '');
  s = s.replace(/平方米|平方厘米|平方厘米|米|厘米|千米|元|个|只|块|盆|秒|分|时|天|人|块/g, '');
  var cn = {'零':'0','一':'1','二':'2','两':'2','三':'3','四':'4','五':'5','六':'6','七':'7','八':'8','九':'9','十':'10','百':'100'};
  s = s.replace(/[零一二两三四五六七八九十百]/g, function (c) { return cn[c] !== undefined ? cn[c] : c; });
  return s;
}
function checkAnswer(input, q) {
  var a = normalize(input), keys = q.accepts || [q.answer];
  for (var i = 0; i < keys.length; i++) {
    if (a === normalize(keys[i])) return true;
  }
  var nums = a.match(/\d+\.?\d*/g);
  for (var j = 0; j < keys.length; j++) {
    var kn = normalize(keys[j]).match(/\d+\.?\d*/g);
    if (nums && kn && nums.length && kn.length && nums[0] === kn[0]) return true;
  }
  return false;
}
function submitAnswer() {
  if (current.answered) return;
  var input = document.getElementById('answerInput');
  var val = input.value.trim();
  if (!val) { input.focus(); return; }
  current.answered = true;
  var q = QUESTIONS.filter(function (x) { return x.id === current.ids[current.idx]; })[0];
  var ok = checkAnswer(val, q);
  input.disabled = true;
  if (ok) {
    current.correct++;
    var w = state.wrong[q.id] || 0;
    if (w > 0) {
      if (w >= 2) delete state.wrong[q.id];
      else state.wrong[q.id] = w + 1;
    }
    document.getElementById('feedback').innerHTML = '<div class="feedback ok">答对了！</div>';
  } else {
    state.wrong[q.id] = 1;
    document.getElementById('feedback').innerHTML = '<div class="feedback no">这次没对，正确答案是「' + q.answer + '」。别急，看下面的解析。</div>';
  }
  saveState();
  var lines = q.solution.split('\n');
  var body = lines.map(function (line) {
    if (line.indexOf('【') === 0) {
      var end = line.indexOf('】');
      if (end > 0) return '<div class="label">' + line.slice(0, end + 1) + '</div><div>' + line.slice(end + 1) + '</div>';
    }
    return '<div>' + line + '</div>';
  }).join('');
  document.getElementById('solution').innerHTML =
    '<div class="solution"><div class="solution-head" id="solHead">展开解析与思路点拨 <span>▾</span></div>' +
    '<div class="solution-body hidden" id="solBody">' + body + '</div></div>';
  bindSolutionToggle();
  document.getElementById('submitBtn').classList.add('hidden');
  document.getElementById('nextBtn').classList.remove('hidden');
  saveSession();
}
function finishQuiz() {
  var star = current.correct;
  if (!current.isWrongMode && current.categoryId) {
    var lv = current.categoryId;
    if (!state.stars[lv] || star > state.stars[lv]) state.stars[lv] = star;
  }
  state.history.push({ ts: Date.now(), correct: current.correct, total: current.ids.length });
  state.history = state.history.slice(-50);
  saveState();
  clearSession();
  applyRank();
  document.getElementById('resultStars').textContent = '★'.repeat(star) + '☆'.repeat(current.ids.length - star);
  document.getElementById('resultCorrect').textContent = current.correct;
  document.getElementById('resultWrong').textContent = current.ids.length - current.correct;
  document.getElementById('resultTotal').textContent = current.ids.length;
  document.getElementById('resultTip').textContent = current.correct === current.ids.length ? '全对！这一关稳了。' : '错题已收进错题本，过几天再来练一次。';
  showPage('pageResult');
}
function renderWrong() {
  var ids = Object.keys(state.wrong).filter(function (k) { return state.wrong[k] > 0; }).map(Number);
  var html = '';
  ids.forEach(function (id) {
    var q = QUESTIONS.filter(function (x) { return x.id === id; })[0];
    if (!q) return;
    html += '<div class="wrong-item"><div class="wrong-q">' + q.q + '</div>' +
      '<div class="wrong-answer">正确：' + q.answer + '</div>' +
      '<div class="wrong-explain">' + q.solution.split('\n')[0] + '</div></div>';
  });
  document.getElementById('wrongList').innerHTML = html || '<div class="empty">错题本是空的，继续保持</div>';
  document.getElementById('wrongPractice').classList.toggle('hidden', ids.length === 0);
  showPage('pageWrong');
}

function restoreSession() {
  var s = loadSession();
  if (!validSession(s)) return false;
  applyRank();
  current = {
    ids: s.ids.slice(), idx: s.idx, correct: s.correct || 0,
    answered: !!s.answered, isWrongMode: !!s.isWrongMode,
    categoryId: s.categoryId || 0
  };
  var catName = '练习';
  LEVELS.forEach(function (l) { if (l.id === current.categoryId) catName = l.name; });
  document.getElementById('quizLevel').textContent = current.isWrongMode ? '错题重练' : catName;
  renderQuestion(s);
  showPage('pageQuiz');
  return true;
}

document.getElementById('levelList').addEventListener('click', function (e) {
  var item = e.target.closest('.level-item');
  if (!item) return;
  var lv = Number(item.getAttribute('data-level'));
  var ids = CATEGORY_IDS[lv] || [];
  if (ids.length) startQuiz(ids, false, lv);
});
document.getElementById('quizBack').addEventListener('click', renderHome);
document.getElementById('resumeBtn').addEventListener('click', function () { restoreSession(); });
document.getElementById('submitBtn').addEventListener('click', submitAnswer);
document.getElementById('answerInput').addEventListener('input', saveSession);
document.getElementById('answerInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') submitAnswer();
});
document.getElementById('nextBtn').addEventListener('click', function () {
  current.idx++;
  if (current.idx >= current.ids.length) finishQuiz();
  else renderQuestion();
});
document.getElementById('retryBtn').addEventListener('click', function () { startQuiz(current.ids, current.isWrongMode, current.categoryId); });
document.getElementById('backHome').addEventListener('click', renderHome);
document.getElementById('wrongEntry').addEventListener('click', renderWrong);
document.getElementById('wrongBack').addEventListener('click', renderHome);
document.getElementById('wrongPractice').addEventListener('click', function () {
  var ids = Object.keys(state.wrong).filter(function (k) { return state.wrong[k] > 0; }).map(Number);
  if (ids.length) startQuiz(ids, true);
});
document.getElementById('exportBtn').addEventListener('click', function () {
  var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'math-qa-backup.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  document.getElementById('dataMsg').textContent = '已导出';
});
document.getElementById('importBtn').addEventListener('click', function () { document.getElementById('importFile').click(); });
document.getElementById('importFile').addEventListener('change', function (e) {
  var f = e.target.files && e.target.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    try {
      var d = JSON.parse(r.result);
      if (!d || !d.stars || !d.wrong) throw new Error('bad');
      if (!window.confirm('导入会覆盖当前进度，确定吗？')) return;
      state = { stars:d.stars, wrong:d.wrong, history:Array.isArray(d.history) ? d.history : [] };
      clearSession(); saveState(); renderHome();
      document.getElementById('dataMsg').textContent = '导入成功';
    } catch (err) { document.getElementById('dataMsg').textContent = '文件格式不对'; }
  };
  r.readAsText(f);
  e.target.value = '';
});

if (!restoreSession()) renderHome();
</script>
</body>
</html>
